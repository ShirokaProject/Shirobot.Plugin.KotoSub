name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KotoSub
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Shirobot.Plugin.KotoSub

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: Shirobot.Plugin.KotoSub

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\tests\Shirobot.Plugin.KotoSub.Tests\Shirobot.Plugin.KotoSub.Tests.csproj --disable-parallel -m:1 -p:BuildInParallel=false -p:UsedAvaloniaProducts=

      - name: Test
        run: dotnet test .\tests\Shirobot.Plugin.KotoSub.Tests\Shirobot.Plugin.KotoSub.Tests.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false -p:UsedAvaloniaProducts=

      - name: Publish plugin
        run: dotnet publish .\Shirobot.Plugin.KotoSub\Shirobot.Plugin.KotoSub.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false -p:UsedAvaloniaProducts= --output artifacts/publish -v:minimal

      - name: Verify package layout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishRoot = Join-Path $PWD "artifacts/publish"
          $packageRoot = Join-Path $PWD "artifacts/plugin"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          foreach ($name in @("Shirobot.Plugin.KotoSub.dll", "config.toml")) {
            $source = Join-Path $publishRoot $name
            if (-not (Test-Path $source)) {
              throw "Missing expected package file: $name"
            }
            Copy-Item -LiteralPath $source -Destination $packageRoot
          }

          $sharedNames = @("ShiroBot.SDK.dll", "ShiroBot.Model.QQ.dll")
          $sharedAssemblies = @(Get-ChildItem $packageRoot -Recurse -File | Where-Object { $_.Name -in $sharedNames })
          if ($sharedAssemblies.Count -gt 0) {
            throw "Host shared assemblies must not be packaged: $($sharedAssemblies.Name -join ', ')"
          }

          $packageFiles = @(Get-ChildItem $packageRoot -Recurse -File)
          if ($packageFiles.Count -ne 2) {
            throw "Plugin artifact must contain only the DLL and config.toml. Found: $($packageFiles.Name -join ', ')"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shirobot.Plugin.KotoSub
          if-no-files-found: error
          path: Shirobot.Plugin.KotoSub/artifacts/plugin/*
